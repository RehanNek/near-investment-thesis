<svg viewBox="0 0 720 300" role="img" aria-labelledby="c6-staked-t c6-staked-d" xmlns="http://www.w3.org/2000/svg" width="720" height="300"><title id="c6-staked-t">Share of all NEAR staked with validators, month end</title><desc id="c6-staked-d">The share of all NEAR staked with validators fell from 47.3% to 45.2% between the end of Jan 2025 and the end of Oct 2026. Across those month ends it was between 40.7% and 48.5%. The amount staked rose from 582.6M to 592M NEAR, while total supply rose from 1.23B to 1.31B.</desc><style>svg{--surface:#fcfcfb;--page:#f9f9f7;--text-1:#0b0b0b;--text-2:#52514e;--muted:#898781;--grid:#e1e0d9;--axis:#c3c2b7;--border:rgba(11,11,11,0.10);--wash:rgba(11,11,11,0.05);--link:#256abf;--c-intents:#2a78d6;--c-l1:#eb6834;--c-ai:#1baf7a;--c-kaiching:#eda100;--c-hot:#e87ba4;--c-agg:#008300;--c-rest:#b5b3aa;--c-ink:#52514e;--c-o1:#86b6ef;--c-o2:#2a78d6;--c-o3:#104281}.c-bg{fill:var(--surface)}.c-grid{stroke:var(--grid);stroke-width:1;shape-rendering:crispEdges}.c-axis{stroke:var(--axis);stroke-width:1;shape-rendering:crispEdges}svg text{font-family:system-ui, -apple-system, "Segoe UI", sans-serif}.c-tick{fill:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}.c-lbl{fill:var(--text-2);font-size:12px}.c-sm{fill:var(--text-2);font-size:11px}.c-val{fill:var(--text-1);font-size:12px;font-weight:600}.c-big{fill:var(--text-1);font-size:20px;font-weight:600}.c-head{fill:var(--text-1);font-size:12px;font-weight:600}.c-ref{stroke:var(--text-2);stroke-width:1}.c-event{stroke:var(--axis);stroke-width:1}.c-line{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}.c-dash{stroke-dasharray:6 4}.c-ring{stroke:var(--surface);stroke-width:2}.c-node{fill:var(--surface);stroke:var(--axis);stroke-width:1}.c-arrow{stroke:var(--muted);stroke-width:1.5;fill:none}.c-head-fill{fill:var(--muted)}.c-hl{fill:var(--wash)}.f-intents{fill:var(--c-intents)}.k-intents{stroke:var(--c-intents)}.f-l1{fill:var(--c-l1)}.k-l1{stroke:var(--c-l1)}.f-ai{fill:va