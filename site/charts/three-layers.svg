<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 720 592" role="img" aria-labelledby="three-layers-t three-layers-d" xmlns="http://www.w3.org/2000/svg" width="720" height="592"><title id="three-layers-t">NEAR&#x27;s three layers, and the token they share</title><desc id="three-layers-d">People, apps and AI agents reach NEAR through three layers. NEAR AI served 225.2B tokens on OpenRouter in the week to Nov 8, 2026. NEAR Intents handled $3.99B of swaps in Oct 2026. The NEAR L1 carried 729.9K transactions a day in Oct 2026 and held 589.8M staked NEAR on Nov 14, 2026. Each layer connects to the NEAR token: AI customers stake it, Intents fees buy it back, and L1 gas fees burn it.</desc><style>svg{--surface:#fcfcfb;--page:#f9f9f7;--text-1:#0b0b0b;--text-2:#52514e;--muted:#898781;--grid:#e1e0d9;--axis:#c3c2b7;--border:rgba(11,11,11,0.10);--wash:rgba(11,11,11,0.05);--link:#256abf;--c-intents:#2a78d6;--c-l1:#eb6834;--c-ai:#1baf7a;--c-kaiching:#eda100;--c-hot:#e87ba4;--c-agg:#008300;--c-rest:#b5b3aa;--c-ink:#52514e;--c-o1:#86b6ef;--c-o2:#2a78d6;--c-o3:#104281}.c-bg{fill:var(--surface)}.c-grid{stroke:var(--grid);stroke-width:1;shape-rendering:crispEdges}.c-axis{stroke:var(--axis);stroke-width:1;shape-rendering:crispEdges}svg text{font-family:system-ui, -apple-system, "Segoe UI", sans-serif}.c-tick{fill:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}.c-lbl{fill:var(--text-2);font-size:12px}.c-sm{fill:var(--text-2);font-size:11px}.c-val{fill:var(--text-1);font-size:12px;font-weight:600}.c-big{fill:var(--text-1);font-size:20px;font-weight:600}.c-head{fill:var(--text-1);font-size:12px;font-weight:600}.c-ref{stroke:var(--text-2);stroke-width:1}.c-event{stroke:var(--axis);stroke-width:1}.c-line{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}.c-dash{stroke-dasharray:6 4}.c-ring{stroke:var(--surface);stroke-width:2}.c-node{fill:var(--surface);stroke:var(--axis);stroke-width:1}.c-arrow{stroke:var(--muted);stroke-width:1.5;fill:none}.c-head-fill{fill:var(--muted)}.c-hl{fill:var(--wash)}.f-intents{fill:var(--c-intents)}.k-intents{stroke:var(--c-intents)}.f-l1{fill:var(--c-l1)}.k-l1{stroke:var(--c-l1)}.f-ai{fill:var(--c-ai)}.k-ai{stroke:var(--c-ai)}.f-kaiching{fill:var(--c-kaiching)}.k-kaiching{stroke:var(--c-kaiching)}.f-hot{fill:var(--c-hot)}.k-hot{stroke:var(--c-hot)}.f-agg{fill:var(--c-agg)}.k-agg{stroke:var(--c-agg)}.f-rest{fill:var(--c-rest)}.k-rest{stroke:var(--c-rest)}.f-ink{fill:var(--c-ink)}.k-ink{stroke:var(--c-ink)}.f-o1{fill:var(--c-o1)}.k-o1{stroke:var(--c-o1)}.f-o2{fill:var(--c-o2)}.k-o2{stroke:var(--c-o2)}.f-o3{fill:var(--c-o3)}.k-o3{stroke:var(--c-o3)}</style><rect class="c-bg" width="720" height="592"/><circle cx="160" cy="14" r="6" class="c-arrow"/><path d="M148,34a12,12 0 0 1 24,0" class="c-arrow"/><rect x="346" y="8" width="28" height="24" rx="4" class="c-arrow"/><line x1="346" y1="16" x2="374" y2="16" class="c-arrow"/><rect x="548" y="13" width="24" height="20" rx="5" class="c-arrow"/><line x1="560" y1="13" x2="560" y2="8" class="c-arrow"/><circle cx="560" cy="6" r="2" class="c-head-fill"/><circle cx="555" cy="23" r="2" class="c-head-fill"/><circle cx="565" cy="23" r="2" class="c-head-fill"/><text x="160.0" y="52.0" class="c-head" text-anchor="middle">People</text><line x1="160" y1="58" x2="160" y2="66" class="c-arrow"/><text x="360.0" y="52.0" class="c-head" text-anchor="middle">Apps and businesses</text><line x1="360" y1="58" x2="360" y2="66" class="c-arrow"/><text x="560.0" y="52.0" class="c-head" text-anchor="middle">AI agents</text><line x1="560" y1="58" x2="560" y2="66" class="c-arrow"/><line x1="160" y1="66" x2="560" y2="66" class="c-arrow"/><line x1="360.0" y1="66.0" x2="360.0" y2="93.0" class="c-arrow"/><path d="M360.0,99.0l-4,-7h8z" class="c-head-fill"/><text x="374.0" y="86.0" class="c-sm" text-anchor="start">They ask for a result: an answer, a swap, a payment</text><rect x="4" y="102" width="712" height="108" rx="8" class="c-node"/><path d="M12,102H180V210H12A8,8 0 0 1 4,202V110A8,8 0 0 1 12,102Z" class="f-ai" fill-opacity="0.12"/><rect x="18" y="116" width="24" height="4" rx="2" class="f-ai"/><text x="18.0" y="160.0" class="c-big" text-anchor="start">NEAR AI</text><text x="18.0" y="178.0" class="c-sm" text-anchor="start">private AI cloud</text><text x="196.0" y="126.0" class="c-head" text-anchor="start">Runs open AI models in secure hardware, so prompts stay private</text><circle cx="199" cy="142" r="2" class="c-head-fill"/><text x="208.0" y="146.0" class="c-lbl" text-anchor="start">225.2B tokens served on OpenRouter in the week to Nov 8, 2026</text><circle cx="199" cy="159" r="2" class="c-head-fill"/><text x="208.0" y="163.0" class="c-lbl" text-anchor="start">16× the tokens of its first full week on OpenRouter</text><circle cx="199" cy="176" r="2" class="c-head-fill"/><text x="208.0" y="180.0" class="c-lbl" text-anchor="start">Brave&#x27;s AI assistant Leo has offered a model on it since Oct 15, 2026</text><circle cx="199" cy="193" r="2" class="c-head-fill"/><text x="208.0" y="197.0" class="c-lbl" text-anchor="start">1.5M NEAR staked for AI credits on Nov 14, 2026</text><line x1="92.0" y1="212.0" x2="92.0" y2="237.0" class="c-arrow"/><path d="M92.0,243.0l-4,-7h8z" class="c-head-fill"/><text x="106.0" y="231.0" class="c-sm" text-anchor="start">AI agents that pay or trade across chains can use Intents</text><rect x="4" y="244" width="712" height="108" rx="8" class="c-node"/><path d="M12,244H180V352H12A8,8 0 0 1 4,344V252A8,8 0 0 1 12,244Z" class="f-intents" fill-opacity="0.12"/><rect x="18" y="258" width="24" height="4" rx="2" class="f-intents"/><text x="18.0" y="302.0" class="c-big" text-anchor="start">NEAR Intents</text><text x="18.0" y="320.0" class="c-sm" text-anchor="start">cross-chain swaps</text><text x="196.0" y="268.0" class="c-head" text-anchor="start">Swaps between any two chains in one step</text><circle cx="199" cy="284" r="2" class="c-head-fill"/><text x="208.0" y="288.0" class="c-lbl" text-anchor="start">$3.99B of swaps in Oct 2026, 2.3× the level a year earlier</text><circle cx="199" cy="301" r="2" class="c-head-fill"/><text x="208.0" y="305.0" class="c-lbl" text-anchor="start">58% of native cross-chain swap volume, against 45% a year earlier</text><circle cx="199" cy="318" r="2" class="c-head-fill"/><text x="208.0" y="322.0" class="c-lbl" text-anchor="start">On 1Click: 269K users, 352 apps and 37 starting chains in Oct 2026</text><circle cx="199" cy="335" r="2" class="c-head-fill"/><text x="208.0" y="339.0" class="c-lbl" text-anchor="start">95% of NEAR&#x27;s protocol revenue over Aug 2026–Oct 2026</text><line x1="92.0" y1="354.0" x2="92.0" y2="379.0" class="c-arrow"/><path d="M92.0,385.0l-4,-7h8z" class="c-head-fill"/><text x="106.0" y="373.0" class="c-sm" text-anchor="start">Every Intents swap settles on the L1</text><rect x="4" y="386" width="712" height="108" rx="8" class="c-node"/><path d="M12,386H180V494H12A8,8 0 0 1 4,486V394A8,8 0 0 1 12,386Z" class="f-l1" fill-opacity="0.12"/><rect x="18" y="400" width="24" height="4" rx="2" class="f-l1"/><text x="18.0" y="444.0" class="c-big" text-anchor="start">NEAR L1</text><text x="18.0" y="462.0" class="c-sm" text-anchor="start">the base chain</text><text x="196.0" y="410.0" class="c-head" text-anchor="start">The blockchain where swaps settle and NEAR is staked</text><circle cx="199" cy="426" r="2" class="c-head-fill"/><text x="208.0" y="430.0" class="c-lbl" text-anchor="start">729.9K transactions a day in Oct 2026, at about 1 cent each</text><circle cx="199" cy="443" r="2" class="c-head-fill"/><text x="208.0" y="447.0" class="c-lbl" text-anchor="start">Intents is 8.9% of transactions in Oct 2026, against 1.6% a year earlier</text><circle cx="199" cy="460" r="2" class="c-head-fill"/><text x="208.0" y="464.0" class="c-lbl" text-anchor="start">589.8M NEAR staked with 355 validators, 45.0% of supply (Nov 14, 2026)</text><circle cx="199" cy="477" r="2" class="c-head-fill"/><text x="208.0" y="481.0" class="c-lbl" text-anchor="start">All gas fees are burned since Nov 5, 2026</text><line x1="92.0" y1="496.0" x2="92.0" y2="521.0" class="c-arrow"/><path d="M92.0,527.0l-4,-7h8z" class="c-head-fill"/><text x="106.0" y="515.0" class="c-sm" text-anchor="start">Each layer sends value to the same token</text><rect x="4" y="528" width="712" height="56" rx="8" class="c-node"/><rect x="18" y="542" width="24" height="4" rx="2" class="f-ai"/><rect x="46" y="542" width="24" height="4" rx="2" class="f-intents"/><rect x="74" y="542" width="24" height="4" rx="2" class="f-l1"/><text x="18.0" y="570.0" class="c-big" text-anchor="start">NEAR token</text><text x="196.0" y="552.0" class="c-head" text-anchor="start">One token for all three layers</text><text x="196.0" y="571.0" class="c-lbl" text-anchor="start">AI customers stake it · Intents fees buy it back · L1 gas fees burn it</text></svg>
