<svg viewBox="0 0 720 320" role="img" aria-labelledby="timeline-t timeline-d" xmlns="http://www.w3.org/2000/svg" width="720" height="320"><title id="timeline-t">When each mechanism that sends value to the token switched on, over NEAR&#x27;s annual issuance rate</title><desc id="timeline-d">NEAR&#x27;s issuance fell from 5.0% to 2.5% a year at the Oct 2025 cut. Every mechanism that sends value to the token has switched on since: buybacks on Feb 23, 2026, staking for NEAR AI on Jul 30, 2026 and burning all L1 gas on Nov 5, 2026. HSP-029 (passed Nov 2, 2026) would lower issuance to 1.6% by Jan 2029.</desc><style>svg{--surface:#fcfcfb;--page:#f9f9f7;--text-1:#0b0b0b;--text-2:#52514e;--muted:#898781;--grid:#e1e0d9;--axis:#c3c2b7;--border:rgba(11,11,11,0.10);--wash:rgba(11,11,11,0.05);--link:#256abf;--c-intents:#2a78d6;--c-l1:#eb6834;--c-ai:#1baf7a;--c-kaiching:#eda100;--c-hot:#e87ba4;--c-agg:#008300;--c-rest:#b5b3aa;--c-ink:#52514e;--c-o1:#86b6ef;--c-o2:#2a78d6;--c-o3:#104281}.c-bg{fill:var(--surface)}.c-grid{stroke:var(--grid);stroke-width:1;shape-rendering:crispEdges}.c-axis{stroke:var(--axis);stroke-width:1;shape-rendering:crispEdges}svg text{font-family:system-ui, -apple-system, "Segoe UI", sans-serif}.c-tick{fill:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}.c-lbl{fill:var(--text-2);font-size:12px}.c-sm{fill:var(--text-2);font-size:11px}.c-val{fill:var(--text-1);font-size:12px;font-weight:600}.c-big{fill:var(--text-1);font-size:20px;font-weight:600}.c-head{fill:var(--text-1);font-size:12px;font-weight:600}.c-ref{stroke:var(--text-2);stroke-width:1}.c-event{stroke:var(--axis);stroke-width:1}.c-line{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}.c-dash{stroke-dasharray:6 4}.c-ring{stroke:var(--surface);stroke-width:2}.c-node{fill:var(--surface);stroke:var(--axis);stroke-width:1}.c-arrow{stroke:var(--muted);stroke-width:1.5;fill:none}.c-head-fill{fill:var(--muted)}.c-hl{fill:var(--wash)}.f-intents{fill:var(--c-intents)}.k-intents{stroke:var(--c-intents)}.f-l1{fill:var(--c-l1)}.k-l1{stroke:var(--c-l1)}.f-ai{fill:var(--c-ai)}.k-ai{stroke:var(--c-ai)}.f-kaiching{fill:var(--c-kaiching)}.k-kaiching{stroke:var(--c-kaiching)}.f-hot{fill:var(--c-hot)}.k-hot{stroke:var(--c-hot)}.f-agg{fill:var(--c-agg)}.k-agg{stroke:var(--c-agg)}.f-rest{fill:var(--c-rest)}.k-rest{stroke:var(--c-rest)}.f-ink{fill:var(--c-ink)}.k-ink{stroke:var(--c-ink)}.f-o1{fill:var(--c-o1)}.k-o1{stroke:var(--c-o1)}.f-o2{fill:var(--c-o2)}.k-o2{stroke:var(--c-o2)}.f-o3{fill:var(--c-o3)}.k-o3{stroke:var(--c-o3)}</style><rect class="c-bg" width="720" height="320"/><line x1="26.1" y1="12.0" x2="42.1" y2="12.0" class="c-line k-ink"/><text x="48.1" y="16.0" class="c-lbl" text-anchor="start">Actual, from NEAR minted</text><line x1="224.5" y1="12.0" x2="240.5" y2="12.0" class="c-line k-ink c-dash"/><text x="246.5" y="16.0" class="c-lbl" text-anchor="start">HSP-029 path (projection)</text><text x="147.8" y="43.0" class="c-sm" text-anchor="start">Inflation 5% → 2.5%</text><line x1="143.8" x2="143.8" y1="34.0" y2="96.0" class="c-event"/><text x="193.0" y="58.0" class="c-sm" text-anchor="start">Buybacks start</text><line x1="189.0" x2="189.0" y1="49.0" y2="96.0" class="c-event"/><text x="254.2" y="73.0" class="c-sm" text-anchor="start">AI staking opens</text><line x1="250.2" x2="250.2" y1="64.0" y2="96.0" class="c-event"/><text x="291.2" y="43.0" class="c-sm" text-anchor="start">HSP-029 passes</text><line x1="287.2" x2="287.2" y1="34.0" y2="96.0" class="c-event"/><text x="292.4" y="58.0" class="c-sm" text-anchor="start">All gas burned</text><line x1="288.4" x2="288.4" y1="49.0" y2="96.0" class="c-event"/><text x="326.7" y="88.0" class="c-sm" text-anchor="start">Cut to 1.6% begins (assumed)</text><line x1="322.7" x2="322.7" y1="79.0" y2="96.0" class="c-event"/><line x1="26.1" x2="666.0" y1="290.0" y2="290.0" class="c-axis"/><text x="18.1" y="294.0" class="c-tick" text-anchor="end">0%</text><line x1="26.1" x2="666.0" y1="225.3" y2="225.3" class="c-grid"/><text x="18.1" y="229.3" class="c-tick" text-anchor="end">2%</text><line x1="26.1" x2="666.0" y1="160.7" y2="160.7" class="c-grid"/><text x="18.1" y="164.7" class="c-tick" text-anchor="end">4%</text><line x1="26.1" x2="666.0" y1="96.0" y2="96.0" class="c-grid"/><text x="18.1" y="100.0" class="c-tick" text-anchor="end">6%</text><text x="26.1" y="308.0" class="c-tick" text-anchor="middle">2025</text><text x="168.3" y="308.0" class="c-tick" text-anchor="middle">2026</text><text x="310.6" y="308.0" class="c-tick" text-anchor="middle">2027</text><text x="452.8" y="308.0" class="c-tick" text-anchor="middle">2028</text><text x="595.5" y="308.0" class="c-tick" text-anchor="middle">2029</text><line x1="143.8" x2="143.8" y1="96.0" y2="290.0" class="c-event"/><line x1="189.0" x2="189.0" y1="96.0" y2="290.0" class="c-event"/><line x1="250.2" x2="250.2" y1="96.0" y2="290.0" class="c-event"/><line x1="287.2" x2="287.2" y1="96.0" y2="290.0" class="c-event"/><line x1="322.7" x2="322.7" y1="96.0" y2="290.0" class="c-event"/><line x1="288.4" x2="288.4" y1="96.0" y2="290.0" class="c-event"/><path d="M26.1,128.6L38.2,127.9L49.1,130.1L61.2,129.0L72.9,126.9L84.9,129.1L96.6,129.2L108.7,128.0L120.8,128.4L132.5,135.2L144.6,210.1L156.3,209.9L168.3,209.2L180.4,209.7L191.3,209.2L203.4,209.5L215.1,209.2L227.2,209.8L238.9,209.7L251.0,209.5L263.0,209.3L274.7,209.6" class="c-line k-ink"/><path d="M274.7,209.2L286.8,209.2L298.5,209.2L310.6,209.2L322.7,210.4L333.6,211.6L345.7,212.8L357.4,214.0L369.4,215.2L381.1,216.4L393.2,217.7L405.3,218.9L417.0,220.1L429.1,221.3L440.7,222.5L452.8,223.7L464.9,224.9L476.2,226.1L488.3,227.4L500.0,228.6L512.1,229.8L523.8,231.0L535.8,232.2L547.9,233.4L559.6,234.6L571.7,235.8L583.4,237.1L595.5,238.3L607.5,238.3L618.5,238.3L630.5,238.3L642.2,238.3L654.3,238.3L666.0,238.3" class="c-line k-ink c-dash"/><circle cx="274.7" cy="209.6" r="4" class="f-ink c-ring"/><circle cx="666.0" cy="238.3" r="4" class="f-ink c-ring"/><text x="283.7" y="213.6" class="c-val">2.49%</text><text x="675.0" y="242.3" class="c-val">1.60%</text></svg>
