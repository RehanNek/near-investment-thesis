-hot)}.k-hot{stroke:var(--c-hot)}.f-agg{fill:var(--c-agg)}.k-agg{stroke:var(--c-agg)}.f-rest{fill:var(--c-rest)}.k-rest{stroke:var(--c-rest)}.f-ink{fill:var(--c-ink)}.k-ink{stroke:var(--c-ink)}.f-o1{fill:var(--c-o1)}.k-o1{stroke:var(--c-o1)}.f-o2{fill:var(--c-o2)}.k-o2{stroke:var(--c-o2)}.f-o3{fill:var(--c-o3)}.k-o3{stroke:var(--c-o3)}</style><rect class="c-bg" width="720" height="300"/><line x1="32.2" y1="12.0" x2="48.2" y2="12.0" class="c-line k-intents"/><text x="54.2" y="16.0" class="c-lbl" text-anchor="start">Capture ratio</text><line x1="158.0" y1="12.0" x2="174.0" y2="12.0" class="c-line k-ai"/><text x="180.0" y="16.0" class="c-lbl" text-anchor="start">Including new AI stake</text><line x1="32.2" x2="666.0" y1="270.0" y2="270.0" class="c-axis"/><text x="24.2" y="274.0" class="c-tick" text-anchor="end">0%</text><line x1="32.2" x2="666.0" y1="222.4" y2="222.4" class="c-grid"/><text x="24.2" y="226.4" class="c-tick" text-anchor="end">10%</text><line x1="32.2" x2="666.0" y1="174.8" y2="174.8" class="c-grid"/><text x="24.2" y="178.8" class="c-tick" text-anchor="end">20%</text><line x1="32.2" x2="666.0" y1="127.2" y2="127.2" class="c-grid"/><text x="24.2" y="131.2" class="c-tick" text-anchor="end">30%</text><line x1="32.2" x2="666.0" y1="79.6" y2="79.6" class="c-grid"/><text x="24.2" y="83.6" class="c-tick" text-anchor="end">40%</text><line x1="32.2" x2="666.0" y1="32.0" y2="32.0" class="c-grid"/><text x="24.2" y="36.0" class="c-tick" text-anchor="end">50%</text><text x="32.2" y="288.0" class="c-tick" text-anchor="middle">Jan 2025</text><text x="121.6" y="288.0" class="c-tick" text-anchor="middle">Apr</text><text x="212.0" y="288.0" class="c-tick" text-anchor="middle">Jul</text><text x="303.4" y="288.0" class="c-tick" text-anchor="middle">Oct</text><text x="394.8" y="288.0" class="c-tick" text-anchor="middle">Jan 2026</text><text x="484.2" y="288.0" class="c-tick" text-anchor="middle">Apr</text><text x="574.6" y="288.0" class="c-tick" text-anchor="middle">Jul</text