<svg viewBox="0 0 720 242" role="img" aria-labelledby="money-flow-t money-flow-d" xmlns="http://www.w3.org/2000/svg" width="720" height="242"><title id="money-flow-t">Follow the money: where NEAR&#x27;s value came from in 2026 Q3</title><desc id="money-flow-d">In 2026 Q3, users paid $14.9M in Intents fees on $10.4B of swaps (0.14%). NEAR kept $3.7M (25%; the rest went to partner apps and solvers), worth 1.5M NEAR, which funds buybacks: the buyback wallet grew by 1.4M NEAR over the quarter. With 66.4K NEAR burned by L1 gas fees, 1.6M NEAR was captured, 19.5% of the 8.2M NEAR issued in the quarter.</desc><style>svg{--surface:#fcfcfb;--page:#f9f9f7;--text-1:#0b0b0b;--text-2:#52514e;--muted:#898781;--grid:#e1e0d9;--axis:#c3c2b7;--border:rgba(11,11,11,0.10);--wash:rgba(11,11,11,0.05);--link:#256abf;--c-intents:#2a78d6;--c-l1:#eb6834;--c-ai:#1baf7a;--c-kaiching:#eda100;--c-hot:#e87ba4;--c-agg:#008300;--c-rest:#b5b3aa;--c-ink:#52514e;--c-o1:#86b6ef;--c-o2:#2a78d6;--c-o3:#104281}.c-bg{fill:var(--surface)}.c-grid{stroke:var(--grid);stroke-width:1;shape-rendering:crispEdges}.c-axis{stroke:var(--axis);stroke-width:1;shape-rendering:crispEdges}svg text{font-family:system-ui, -apple-system, "Segoe UI", sans-serif}.c-tick{fill:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}.c-lbl{fill:var(--text-2);font-size:12px}.c-sm{fill:var(--text-2);font-size:11px}.c-val{fill:var(--text-1);font-size:12px;font-weight:600}.c-big{fill:var(--text-1);font-size:20px;font-weight:600}.c-head{fill:var(--text-1);font-size:12px;font-weight:600}.c-ref{stroke:var(--text-2);stroke-width:1}.c-event{stroke:var(--axis);stroke-width:1}.c-line{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}.c-dash{stroke-dasharray:6 4}.c-ring{stroke:var(--surface);stroke-width:2}.c-node{fill:var(--surface);stroke:var(--axis);stroke-width:1}.c-arrow{stroke:var(--muted);stroke-width:1.5;fill:none}.c-head-fill{fill:var(--muted)}.c-hl{fill:var(--wash)}.f-intents{fill:var(--c-intents)}.k-intents{stroke:var(--c-intents)}.f-l1{fill:var(--c-l1)}.k-l1{stroke:var(--c-l1)}.f-ai{fill:var(--c-ai)}.k-ai{stroke:var(--c-ai)}.f-kaiching{fill:var(--c-kaiching)}.k-kaiching{stroke:var(--c-kaiching)}.f-hot{fill:var(--c-hot)}.k-hot{stroke:var(--c-hot)}.f-agg{fill:var(--c-agg)}.k-agg{stroke:var(--c-agg)}.f-rest{fill:var(--c-rest)}.k-rest{stroke:var(--c-rest)}.f-ink{fill:var(--c-ink)}.k-ink{stroke:var(--c-ink)}.f-o1{fill:var(--c-o1)}.k-o1{stroke:var(--c-o1)}.f-o2{fill:var(--c-o2)}.k-o2{stroke:var(--c-o2)}.f-o3{fill:var(--c-o3)}.k-o3{stroke:var(--c-o3)}</style><rect class="c-bg" width="720" height="242"/><text x="4.0" y="22.0" class="c-head" text-anchor="start">NEAR Intents</text><text x="4.0" y="138.0" class="c-head" text-anchor="start">NEAR L1</text><rect x="4.0" y="34.0" width="124.0" height="80.0" rx="8" class="c-node"/><rect x="16.0" y="46.0" width="24" height="4" rx="2" class="f-intents"/><text x="16.0" y="74.0" class="c-big" text-anchor="start">$10.4B</text><text x="16.0" y="94.0" class="c-lbl" text-anchor="start">swap volume</text><rect x="188.0" y="34.0" width="124.0" height="80.0" rx="8" class="c-node"/><rect x="200.0" y="46.0" width="24" height="4" rx="2" class="f-intents"/><text x="200.0" y="74.0" class="c-big" text-anchor="start">$14.9M</text><text x="200.0" y="94.0" class="c-lbl" text-anchor="start">fees paid by users</text><rect x="372.0" y="34.0" width="124.0" height="80.0" rx="8" class="c-node"/><rect x="384.0" y="46.0" width="24" height="4" rx="2" class="f-intents"/><text x="384.0" y="74.0" class="c-big" text-anchor="start">$3.7M</text><text x="384.0" y="94.0" class="c-lbl" text-anchor="start">NEAR&#x27;s share</text><rect x="4.0" y="150.0" width="124.0" height="80.0" rx="8" class="c-node"/><rect x="16.0" y="162.0" width="24" height="4" rx="2" class="f-l1"/><text x="16.0" y="190.0" class="c-big" text-anchor="start">739.9K</text><text x="16.0" y="210.0" class="c-lbl" text-anchor="start">L1 transactions</text><text x="16.0" y="225.0" class="c-lbl" text-anchor="