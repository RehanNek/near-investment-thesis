5M NEAR</text><line x1="131.0" y1="190.0" x2="182.0" y2="190.0" class="c-arrow"/><path d="M187.0,190.0l-7.0,-4v8z" class="c-head-fill"/><text x="158.0" y="182.0" class="c-sm" text-anchor="middle">gas</text><line x1="315.0" y1="190.0" x2="366.0" y2="190.0" class="c-arrow"/><path d="M371.0,190.0l-7.0,-4v8z" class="c-head-fill"/><text x="342.0" y="169.0" class="c-sm" text-anchor="middle">70%</text><text x="342.0" y="182.0" class="c-sm" text-anchor="middle">burned</text><line x1="499.0" y1="190.0" x2="550.0" y2="190.0" class="c-arrow"/><path d="M555.0,190.0l-7.0,-4v8z" class="c-head-fill"/></svg>
