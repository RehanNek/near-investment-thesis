<svg viewBox="0 0 720 358" role="img" aria-labelledby="money-flow-t money-flow-d" xmlns="http://www.w3.org/2000/svg" width="720" height="358"><title id="money-flow-t">Follow the money: what each layer earned in Oct 2026, and what reached the token</title><desc id="money-flow-d">In Oct 2026, users paid $6.4M in fees on $3.99B of Intents swaps (0.16%). NEAR kept $2.5M (39%; the rest went to partner apps and solvers), worth 506.9K NEAR, which funds buybacks. L1 gas fees burned another 31.5K NEAR. Together that is 538.4K NEAR, 19.5% of the 2.8M NEAR issued in the month. NEAR AI sold an estimated $80K of inference on OpenRouter; that money goes to NEAR AI, and no published mechanism sends it to the token. What reaches the token from NEAR AI is staking: customers staked 687.3K more NEAR for inference credits, which locks it without removing it.</desc><style>svg{--surface:#fcfcfb;--page:#f9f9f7;--text-1:#0b0b0b;--text-2:#52514e;--muted:#898781;--grid:#e1e0d9;--axis:#c3c2b7;--border:rgba(11,11,11,0.10);--wash:rgba(11,11,11,0.05);--link:#256abf;--c-intents:#2a78d6;--c-l1:#eb6834;--c-ai:#1baf7a;--c-kaiching:#eda100;--c-hot:#e87ba4;--c-agg:#008300;--c-rest:#b5b3aa;--c-ink:#52514e;--c-o1:#86b6ef;--c-o2:#2a78d6;--c-o3:#104281}.c-bg{fill:var(--surface)}.c-grid{stroke:var(--grid);stroke-width:1;shape-rendering:crispEdges}.c-axis{stroke:var(--axis);stroke-width:1;shape-rendering:crispEdges}svg text{font-family:system-ui, -apple-system, "Segoe UI", sans-serif}.c-tick{fill:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}.c-lbl{fill:var(--text-2);font-size:12px}.c-sm{fill:var(--text-2);font-size:11px}.c-val{fill:var(--text-1);font-size:12px;font-weight:600}.c-big{fill:var(--text-1);font-size:20px;font-weight:600}.c-head{fill:var(--text-1);font-size:12px;font-weight:600}.c-ref{stroke:var(--text-2);stroke-width:1}.c-event{stroke:var(--axis);stroke-width:1}.c-line{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}.c-dash{stroke-dasharray:6 4}.c-ring{stroke:var(--surface);stroke-width:2}.c-node{fill:var(--surface);stroke:var(--axis);stroke-width:1}.c-arrow{stroke:var(--muted);stroke-width:1.5;fill:none}.c-head-fill{fill:var(--muted)}.c-hl{fill:var(--wash)}.f-intents{fill:var(--c-intents)}.k-intents{stroke:var(--c-intents)}.f-l1{fill:var(--c-l1)}.k-l1{stroke:var(--c-l1)}.f-ai{fill:var(--c-ai)}.k-ai{stroke:var(--c-ai)}.f-kaiching{fill:var(--c-kaiching)}.k-kaiching{stroke:var(--c-kaiching)}.f-hot{fill:var(--c-hot)}.k-hot{stroke:var(--c-hot)}.f-agg{fill:var(--c-agg)}.k-agg{stroke:var(--c-agg)}.f-rest{fill:var(--c-rest)}.k-rest{stroke:var(--c-rest)}.f-ink{fill:var(--c-ink)}.k-ink{stroke:var(--c-ink)}.f-o1{fill:var(--c-o1)}.k-o1{stroke:var(--c-o1)}.f-o2{fill:var(--c-o2)}.k-o2{stroke:var(--c-o2)}.f-o3{fill:var(--c-o3)}.k-o3{stroke:var(--c-o3)}</style><rect class="c-bg" width="720" height="358"/><text x="4.0" y="22.0" class="c-head">NEAR Intents<tspan class="c-sm" font-weight="400" dx="8">cross-chain swaps</tspan></text><text x="4.0" y="138.0" class="c-head">NEAR L1<tspan class="c-sm" font-weight="400" dx="8">the base chain</tspan></text><text x="4.0" y="254.0" class="c-head">NEAR AI<tspan class="c-sm" font-weight="400" dx="8">private AI</tspan></text><text x="556.0" y="22.0" class="c-head" text-anchor="start">What reached the token</text><rect x="4.0" y="34.0" width="124.0" height="80.0" rx="8" class="c-node"/><rect x="16.0" y="46.0" width="24" height="4" rx="2" class="f-intents"/><text x="16.0" y="74.0" class="c-big" text-anchor="start">$3.99B</text><text x="16.0" y="94.0" class="c-lbl" text-anchor="start">swap volume</text><rect x="188.0" y="34.0" width="124.0" height="80.0" rx="8" class="c-node"/><rect x="200.0" y="46.0" width="24" height="4" rx="2" class="f-intents"/><text x="200.0" y="74.0" class="c-big" text-anchor="start">$6.4M</text><text x="200.0" y="94.0" class="c-lbl" text-anchor="start">fees paid by users</text><rect x="372.0" y="34.0" width="124.0" height="80.0" rx="8" class="c-node"/><rect x="384.0" y="46.0" width="24" height="4" rx="2" class="f-intents"/><text x="384.0" y="74.0" class="c-big" text-anchor="start">$2.5M</text><text x="384.0" y="94.0" class="c-lbl" text-anchor="start">NEAR&#x27;s share</text><rect x="4.0" y="150.0" width="124.0" height="80.0" rx="8" class="c-node"/><rect x="16.0" y="162.0" width="24" height="4" rx="2" class="f-l1"/><text x="16.0" y="190.0" class="c-big" text-anchor="start">729.9K</text><text x="16.0" y="210.0" class="c-lbl" text-anchor="start">L1 transactions</text><text x="16.0" y="225.0" class="c-lbl" text-anchor="start">a day</text><rect x="188.0" y="150.0" width="124.0" height="80.0" rx="8" class="c-node"/><rect x="200.0" y="162.0" width="24" height="4" rx="2" class="f-l1"/><text x="200.0" y="190.0" class="c-big" text-anchor="start">$223.6K</text><text x="200.0" y="210.0" class="c-lbl" text-anchor="start">L1 gas fees</text><rect x="372.0" y="150.0" width="124.0" height="80.0" rx="8" class="c-node"/><rect x="384.0" y="162.0" width="24" height="4" rx="2" class="f-l1"/><text x="384.0" y="190.0" class="c-big" text-anchor="start">31.5K</text><text x="384.0" y="210.0" class="c-lbl" text-anchor="start">NEAR burned</text><rect x="4.0" y="266.0" width="124.0" height="80.0" rx="8" class="c-node"/><rect x="16.0" y="278.0" width="24" height="4" rx="2" class="f-ai"/><text x="16.0" y="306.0" class="c-big" text-anchor="start">887.2B</text><text x="16.0" y="326.0" class="c-lbl" text-anchor="start">AI tokens served</text><text x="16.0" y="341.0" class="c-lbl" text-anchor="start">on OpenRouter</text><rect x="188.0" y="266.0" width="124.0" height="80.0" rx="8" class="c-node"/><rect x="200.0" y="278.0" width="24" height="4" rx="2" class="f-ai"/><text x="200.0" y="306.0" class="c-big" text-anchor="start">$80K</text><text x="200.0" y="326.0" class="c-lbl" text-anchor="start">inference sales</text><text x="200.0" y="341.0" class="c-lbl" text-anchor="start">(est.), to NEAR AI</text><rect x="372.0" y="266.0" width="124.0" height="80.0" rx="8" class="c-node"/><rect x="384.0" y="278.0" width="24" height="4" rx="2" class="f-ai"/><text x="384.0" y="306.0" class="c-big" text-anchor="start">1.4M</text><text x="384.0" y="326.0" class="c-lbl" text-anchor="start">NEAR staked for</text><text x="384.0" y="341.0" class="c-lbl" text-anchor="start">AI credits</text><rect x="556" y="34" width="160" height="312" rx="8" class="c-node"/><rect x="568" y="46" width="24" height="4" rx="2" class="f-intents"/><rect x="596" y="46" width="24" height="4" rx="2" class="f-l1"/><rect x="624" y="46" width="24" height="4" rx="2" class="f-ai"/><text x="568.0" y="78.0" class="c-big" text-anchor="start">538.4K</text><text x="568.0" y="98.0" class="c-lbl" text-anchor="start">NEAR burned or</text><text x="568.0" y="113.0" class="c-lbl" text-anchor="start">bought back</text><text x="568.0" y="133.0" class="c-sm" text-anchor="start">= 19.5% of the</text><text x="568.0" y="147.0" class="c-sm" text-anchor="start">2.8M NEAR issued</text><line x1="568" y1="252" x2="704" y2="252" class="c-arrow"/><text x="568.0" y="300.0" class="c-big" text-anchor="start">+687.3K</text><text x="568.0" y="320.0" class="c-lbl" text-anchor="start">NEAR newly locked</text><text x="568.0" y="335.0" class="c-lbl" text-anchor="start">by AI staking</text><line x1="131.0" y1="74.0" x2="182.0" y2="74.0" class="c-arrow"/><path d="M187.0,74.0l-7.0,-4v8z" class="c-head-fill"/><text x="158.0" y="53.0" class="c-sm" text-anchor="middle">0.16%</text><text x="158.0" y="66.0" class="c-sm" text-anchor="middle">in fees</text><line x1="315.0" y1="74.0" x2="366.0" y2="74.0" class="c-arrow"/><path d="M371.0,74.0l-7.0,-4v8z" class="c-head-fill"/><text x="342.0" y="53.0" class="c-sm" text-anchor="middle">39% kept</text><text x="342.0" y="66.0" class="c-sm" text-anchor="middle">by NEAR</text><line x1="499.0" y1="74.0" x2="550.0" y2="74.0" class="c-arrow"/><path d="M555.0,74.0l-7.0,-4v8z" class="c-head-fill"/><text x="526.0" y="40.0" class="c-sm" text-anchor="middle">buys</text><text x="526.0" y="53.0" class="c-sm" text-anchor="middle">506.9K</text><text x="526.0" y="66.0" class="c-sm" text-anchor="middle">NEAR</text><line x1="131.0" y1="190.0" x2="182.0" y2="190.0" class="c-arrow"/><path d="M187.0,190.0l-7.0,-4v8z" class="c-head-fill"/><text x="158.0" y="182.0" class="c-sm" text-anchor="middle">gas</text><line x1="315.0" y1="190.0" x2="366.0" y2="190.0" class="c-arrow"/><path d="M371.0,190.0l-7.0,-4v8z" class="c-head-fill"/><text x="342.0" y="169.0" class="c-sm" text-anchor="middle">70%</text><text x="342.0" y="182.0" class="c-sm" text-anchor="middle">burned</text><line x1="499.0" y1="190.0" x2="550.0" y2="190.0" class="c-arrow"/><path d="M555.0,190.0l-7.0,-4v8z" class="c-head-fill"/><line x1="131.0" y1="306.0" x2="182.0" y2="306.0" class="c-arrow"/><path d="M187.0,306.0l-7.0,-4v8z" class="c-head-fill"/><text x="158.0" y="285.0" class="c-sm" text-anchor="middle">at list</text><text x="158.0" y="298.0" class="c-sm" text-anchor="middle">prices</text><line x1="315.0" y1="306.0" x2="366.0" y2="306.0" class="c-arrow"/><path d="M371.0,306.0l-7.0,-4v8z" class="c-head-fill"/><text x="342.0" y="285.0" class="c-sm" text-anchor="middle">or pay by</text><text x="342.0" y="298.0" class="c-sm" text-anchor="middle">staking</text><line x1="499.0" y1="306.0" x2="550.0" y2="306.0" class="c-arrow"/><path d="M555.0,306.0l-7.0,-4v8z" class="c-head-fill"/><text x="526.0" y="285.0" class="c-sm" text-anchor="middle">new</text><text x="526.0" y="298.0" class="c-sm" text-anchor="middle">stake</text></svg>
